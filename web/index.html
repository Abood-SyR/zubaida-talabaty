<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="تطبيق لمتابعة الطلبات وإدارتها.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="طلباتي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>طلباتي</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- صندوق لعرض الأخطاء مرئياً على شاشة الآيفون -->
  <div id="error-console" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; color:red; padding:20px; z-index:999999; overflow:auto; font-family:monospace; white-space:pre-wrap; font-size:14px;">
    <h3>⚠️ Flutter Web Error Captured:</h3>
    <p id="error-text"></p>
  </div>

  <script>
    window.addEventListener('error', function (event) {
      var consoleDiv = document.getElementById('error-console');
      var textP = document.getElementById('error-text');
      consoleDiv.style.display = 'block';
      var details = event.error ? (event.error.stack || event.error.message) : event.message;
      textP.textContent += '\n\n[Full Error]: ' + details + '\nAt: ' + event.filename + ':' + event.lineno;
    });

    window.addEventListener('unhandledrejection', function (event) {
      var consoleDiv = document.getElementById('error-console');
      var textP = document.getElementById('error-text');
      consoleDiv.style.display = 'block';
      textP.textContent += '\n\n[Promise Rejection]: ' + (event.reason ? event.reason.stack || event.reason : 'Unknown');
    });
  </script>

  <!-- تشغيل فلاتر القياسي -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
